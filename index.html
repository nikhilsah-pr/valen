<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>Will You Be My Valentine?</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="card" id="ask">

  <!-- CHANGE NAME HERE -->
  <h2> Will you be my Valentine? 💖</h2>

  <div class="buttons">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
    <p>*No* seem to be little shy /- </p>
  </div>

</div>

<div class="card" id="result">
  <h2>YAY! 🎉</h2>
  <h3>Now you owe a coffee ☕ to Nikhil</h3>
  <h5>Screenshot this — it’s official 😉</h5>
       <p id="date"></p>
  <!-- CHANGE GIF HERE -->
  <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExeWl3MW1vYTkxbWkyZ29teHdjcXNqNGl1MHp0c3c4ZDZ4cmQyczNiciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/NoPNkgzHD8HSK6Nr5l/giphy.gif">
  <br><br>
<button onclick="shareLove()">Share 💌</button>


</div>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const yesBtn = document.getElementById("yesBtn");
const ask = document.getElementById("ask");
const result = document.getElementById("result");

document.getElementById("date").innerText ="Made on "+ new Date().toDateString();

const texts = [
  "No😅",
  "No not allowed!",
  "No!",
  "No😏",
  "Just say yes ❤️"
];

noBtn.addEventListener("mouseenter", () => {
  noBtn.innerText = texts[Math.floor(Math.random()*texts.length)];

  const x = Math.random() * 250;
  const y = Math.random() * 60;
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

yesBtn.addEventListener("click", () => {
  ask.style.display = "none";
  result.style.display = "block";

  confetti({
    particleCount: 150,
    spread: 70,
    origin: { y: 0.6 }
  });
});


setInterval(() => {
  const heart = document.createElement("div");
  heart.innerHTML = "❤️";
  heart.style.position = "fixed";
  heart.style.left = Math.random()*100 + "vw";
  heart.style.top = "100vh";
  heart.style.fontSize = "20px";
  document.body.appendChild(heart);

  let pos = 100;
  const anim = setInterval(()=>{
    pos--;
    heart.style.top = pos+"vh";
    if(pos<0){
      heart.remove();
      clearInterval(anim);
    }
  },20);
},800);

function shareLove(){
  if(navigator.share){
    navigator.share({
      title: "Valentine 💖",
      text: "Someone just said YES 😍",
      url: window.location.href
    });
  }else{
    navigator.clipboard.writeText(window.location.href);
    alert("Link copied! Send it 😉");
  }
}


</script>
</body>
</html>
